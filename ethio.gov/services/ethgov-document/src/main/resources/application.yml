server:
  port: 8085

spring:
  application:
    name: ethgov-document
  datasource:
    url: jdbc:postgresql://localhost:5432/ethgov_document
    username: ethgov
    password: ethgov
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ethgov:
  identity:
    issuer: http://localhost:8081
  document:
    storage:
      endpoint: http://localhost:9000
      region: us-east-1
      access-key: ethgovminio
      secret-key: ethgovminio
      bucket: ethgov-documents
      path-style-access: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId},%X{tenantId}]"
