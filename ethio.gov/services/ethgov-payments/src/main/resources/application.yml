server:
  port: 8092

spring:
  application:
    name: ethgov-payments
  datasource:
    url: jdbc:postgresql://localhost:5432/ethgov_payments
    username: ethgov
    password: ethgov
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ethgov:
  identity:
    issuer: http://localhost:8081

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId},%X{tenantId}]"
