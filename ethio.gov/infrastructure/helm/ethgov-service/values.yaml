name: ethgov-service
replicaCount: 2

image:
  repository: ethgov/service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

env:
  TZ: Africa/Addis_Ababa
  SPRING_PROFILES_ACTIVE: kubernetes

otel:
  endpoint: http://otel-collector:4317

probes:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
