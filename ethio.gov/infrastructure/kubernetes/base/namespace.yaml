# EthGov local Kubernetes baseline namespace and resource quotas.
apiVersion: v1
kind: Namespace
metadata:
  name: ethgov
  labels:
    app.kubernetes.io/part-of: ethgov
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ethgov-baseline
  namespace: ethgov
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ethgov-container-defaults
  namespace: ethgov
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "2"
        memory: 2Gi
