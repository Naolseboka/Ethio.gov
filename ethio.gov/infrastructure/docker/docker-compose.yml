services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ethgov-postgres
    environment:
      POSTGRES_DB: ethgov
      POSTGRES_USER: ethgov
      POSTGRES_PASSWORD: ethgov
      TZ: Africa/Addis_Ababa
    ports:
      - "5432:5432"
    volumes:
      - ethgov-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethgov -d ethgov"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: ethgov-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ethgov-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka-native:3.8.1
    container_name: ethgov-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: Africa/Addis_Ababa
    ports:
      - "9092:9092"

  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: ethgov-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ethgov-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ethgov-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ethgov
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ethgov-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ethgov-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ethgovminio
      MINIO_ROOT_PASSWORD: ethgovminio
      TZ: Africa/Addis_Ababa
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ethgov-minio-data:/data

volumes:
  ethgov-postgres-data:
  ethgov-redis-data:
  ethgov-grafana-data:
  ethgov-minio-data:
