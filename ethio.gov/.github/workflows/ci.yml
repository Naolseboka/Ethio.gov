name: ethgov-ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Run checks
        run: ./gradlew check --no-daemon
        env:
          TZ: Africa/Addis_Ababa
